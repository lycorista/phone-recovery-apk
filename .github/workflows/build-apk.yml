name: Build APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool pkg-config libffi-dev libssl-dev zlib1g-dev openjdk-17-jdk git wget unzip zip python3-dev python3-pip libltdl-dev cmake

      - name: Install Buildozer
        run: pip3 install --upgrade buildozer cython

      - name: Cache SDK NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-ubuntu-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-recovery-apk
          path: bin/*.apk

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

